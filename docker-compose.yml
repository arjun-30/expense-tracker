services:
  db:
    image: postgres:16-alpine
    container_name: mecs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mecs
      POSTGRES_PASSWORD: mecs_dev_password
      POSTGRES_DB: mecs
    ports:
      - "5437:5432"
    volumes:
      - mecs_pg_data:/var/lib/postgresql/data

volumes:
  mecs_pg_data:
